server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (wouter): unknown paths fall back to index.html
    # so refreshing on /tests, /book, etc. works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the api service on the compose network.
    # No trailing slash on proxy_pass → the /api prefix is preserved,
    # matching the Express router mounted at /api.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
