# ────────────────────────────────────────────────────────────────
# PathoFix Diagnostics — full local stack.
#
#   docker compose up --build
#
#   Website ....... http://localhost:8080
#   API health .... http://localhost:8080/api/healthz
#   DB browser .... http://localhost:8081   (Adminer)
#   Postgres ...... localhost:5432          (user/pass/db = pathofix)
#
# Notification credentials are OPTIONAL. Bookings save to Postgres and
# succeed without them. To also send email/Telegram locally, put the
# values in a `.env` file next to this one (see .env.example) and they
# are picked up automatically.
# ────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathofix
      POSTGRES_PASSWORD: pathofix
      POSTGRES_DB: pathofix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathofix -d pathofix"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the tables once, then exits. The API waits for this to finish.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: "postgres://pathofix:pathofix@db:5432/pathofix"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "postgres://pathofix:pathofix@db:5432/pathofix"
      # Optional — leave blank to run without notifications.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      LAB_EMAIL: "${LAB_EMAIL:-}"
      TG_BOT_TOKEN: "${TG_BOT_TOKEN:-}"
      TG_CHAT_ID: "${TG_CHAT_ID:-}"
      # Optional — set both in .env to enable the /admin console locally
      # (generate with: node scripts/hash-admin-password.mjs).
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:-}"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

  # Lightweight web UI to browse the database (view bookings, etc.)
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
